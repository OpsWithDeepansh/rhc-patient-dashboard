<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Patient Dashboard</title>

    <link rel="stylesheet" href="Style.css">

    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-datalabels"></script>
</head>

<body>

    <h1 style="margin-bottom:20px;">Patient Dashboard</h1>
    
    <div style="margin-bottom:20px;">

    <label><strong>Month:</strong></label>

    <select id="monthSelector">
        <option value="Jun26">Jun'26</option>
        <option value="May26">May'26</option>
    </select>

</div>
    <!-- KPI ROW -->
    <div class="kpi-row">

        <div class="kpi">
            Total Patients
            <span id="totalPatients">0</span>
        </div>

        <div class="kpi">
            Connected
            <span id="connected">0</span>
        </div>

        <div class="kpi">
            Not Connected
            <span id="notConnected">0</span>
        </div>

        <div class="kpi">
            Inactive
            <span id="inactive">0</span>
        </div>

        <div class="kpi">
            Denied/NRTD
            <span id="denied">0</span>
        </div>

        <div class="kpi">
            Pending
            <span id="pending">0</span>
        </div>

        <div class="kpi">
            Callable Leads
            <span id="callableLeads">0</span>
        </div>

        <div class="kpi highlight">
            Connectivity
            <span id="connectivity">0%</span>
        </div>

    </div>

    <!-- AGENT GRID -->

    <div class="agent-grid" id="agentGrid">

</div>

    <!-- ANALYTICS -->

    <div class="analytics-grid">

        <div class="card">
            <h3>Connectivity Trend</h3>
            <div class="chart-box-large">
                <canvas id="trendChart"></canvas>
            </div>
        </div>

        <div class="card">
            <h3>Daily Performance</h3>
            <div class="chart-box-large">
                <canvas id="dailyChart"></canvas>
            </div>
        </div>

        <div class="card">
            <h3>ITP</h3>
            <div class="chart-box-large">
                <canvas id="itpChart"></canvas>
            </div>
        </div>

    </div>

    <script src="script.js"></script>

</body>

</html>
